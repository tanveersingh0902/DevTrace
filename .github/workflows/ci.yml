# GitHub Actions CI Workflow for DevTrace
#
# This workflow runs on every push and pull request to the main branch.
# It ensures that:
# 1. The code passes linting (Ruff)
# 2. All tests pass (Pytest)
#
# WHY CI?
# Continuous Integration catches bugs before they reach the main branch.
# Every PR is automatically tested, so you never merge broken code.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        working-directory: backend
        run: |
          pytest -v

